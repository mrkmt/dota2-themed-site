<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Normal Match - DOTA 2 Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="match-container">
    <h1>Normal Match</h1>
    <p>Get ready to battle in a classic arena setup.</p>
    <div class="match-panel">
      <button onclick="startMatch()">Start Match</button>
    </div>
    <div id="matchStatus" class="match-status"></div>
  </div>

  <script>
    function startMatch() {
      const btn = document.querySelector(".match-panel button");
      btn.disabled = true;
      btn.innerText = "Searching...";
      const status = document.getElementById("matchStatus");
      status.innerHTML = "<p>Finding teammates and opponents...</p>";
      setTimeout(() => {
        status.innerHTML = "<p style='color: lightgreen;'>Match found! Entering battlefield...</p>";
        btn.innerText = "Start Match";
        btn.disabled = false;
      }, 3000); // simulate loading
    }
  </script>
</body>
</html>
