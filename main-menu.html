<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Menu</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('images/dota-map.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Arial', sans-serif;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    body.fade-in { opacity: 1; }
    .menu-container {
      background: rgba(0,0,0,0.75);
      color: gold;
      text-align: center;
      max-width: 600px;
      margin: 10% auto;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px black;
    }
    button {
      display: block;
      margin: 10px auto;
      padding: 12px 24px;
      background-color: gold;
      color: black;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: orange;
    }
    #muteBtn {
      margin-top: 20px;
      font-size: 0.9em;
      background-color: rgba(255, 215, 0, 0.7);
    }
  </style>
  <script>
    function navigate(page) {
      window.location.href = `${page}.html`;
    }

    function toggleAudio() {
      const audio = document.getElementById("bgm");
      audio.muted = !audio.muted;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
      gsap.from(".menu-container", { y: 100, opacity: 0, duration: 1.2, ease: "power2.out" });
    });
  </script>
</head>
<body>
  <audio id="bgm" autoplay loop>
    <source src="audio/dota2-theme.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="menu-container">
    <h1>Welcome, <span id="playerName"></span></h1>
    <button onclick="navigate('heroes')">🧙 Heroes</button>
    <button onclick="navigate('items')">💰 Items</button>
    <button onclick="navigate('normal-match')">🛡️ Normal Match</button>
    <button onclick="navigate('ranked-match')">🏆 Ranked Match</button>
    <button onclick="navigate('training')">🎓 Training Mode</button>
    <button id="muteBtn" onclick="toggleAudio()">🔊 Mute/Unmute</button>
  </div>

  <script>
    const name = localStorage.getItem("namecode") || "Player";
    document.getElementById("playerName").textContent = name;
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
    });
  </script>
</body>
</html>
