<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranked Match - DOTA 2 Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ranked-container">
    <h1>Ranked Match</h1>
    <div class="mmr-display">
      <p>Your Current MMR:</p>
      <div id="mmrValue">7280</div>
      <img src="images/immortal-medal.png" alt="Immortal Rank" />
      <p class="rank-name">Immortal</p>
    </div>
    <div class="ranked-buttons">
      <button onclick="searchRankedMatch()">Search Ranked Match</button>
    </div>
    <div id="rankStatus" class="rank-status"></div>
  </div>

  <script>
    function searchRankedMatch() {
      const status = document.getElementById("rankStatus");
      status.innerHTML = "Searching for Ranked Match...";
      setTimeout(() => {
        status.innerHTML = "<span style='color:lightgreen'>Ranked Match Found! Entering the Arena...</span>";
      }, 3000);
    }
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
    });
  </script>
  
</body>
</html>
